{% extends "base.html" %}
{% block content %}
<h1>New medicine sample</h1>
<p class="text-muted">Enter values from a laboratory report or a simulated sample for project demonstration.</p>
<div class="alert alert-warning">The example model uses synthetic teaching data and does not verify medicine authenticity or safety.</div>
<form method="post" class="card card-body">
  <div class="row g-3">
    <div class="col-md-4"><label class="form-label">Medicine name</label><input class="form-control" name="medicine_name" required></div>
    <div class="col-md-4"><label class="form-label">Batch number</label><input class="form-control" name="batch_number" required></div>
    <div class="col-md-4"><label class="form-label">Manufacturer</label><input class="form-control" name="manufacturer" required></div>
    <div class="col-md-3"><label class="form-label">pH (0–14)</label><input class="form-control" type="number" step="0.01" min="0" max="14" name="ph" required></div>
    <div class="col-md-3"><label class="form-label">Assay (%)</label><input class="form-control" type="number" step="0.01" min="0" max="150" name="assay_pct" required></div>
    <div class="col-md-3"><label class="form-label">Dissolution (%)</label><input class="form-control" type="number" step="0.01" min="0" max="100" name="dissolution_pct" required></div>
    <div class="col-md-3"><label class="form-label">Moisture (%)</label><input class="form-control" type="number" step="0.01" min="0" max="100" name="moisture_pct" required></div>
  </div>
  <button class="btn btn-primary mt-4" type="submit">Run demonstration screening</button>
</form>
{% endblock %}
